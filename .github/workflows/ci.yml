name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp packages/schema/.env.example packages/schema/.env
      - run: cp packages/server/.env.example packages/server/.env

      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run test

  recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: cp packages/schema/.env.example packages/schema/.env
      - run: cp packages/server/.env.example packages/server/.env

      # Applies each docs/recipes/*.md diff to a freshly scaffolded project
      # and verifies it, so a recipe silently going stale fails CI instead
      # of being caught by hand next time someone follows it.
      - run: pnpm run test:recipes
